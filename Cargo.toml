cargo-features = ["different-binary-name"]

[workspace]
members = ["core"]
resolver = "3"

[package]
name = "nfc-bulk-url-writer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "nfc-bulk-url-writer"
filename = "nfc-bulk-url-writer.fap"
bench = false
test = false

[dependencies]
nfc-bulk-url-writer-core = { path = "core" }
flipperzero = { version = "0.17.0" }
flipperzero-sys = { version = "0.17.0" }
flipperzero-rt = { version = "0.17.0" }
